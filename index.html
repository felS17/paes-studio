<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entrena gratis para la PAES con las pruebas reales del DEMRE, explicaciones paso a paso y tarjetas de repaso. Sin cuentas ni contraseñas." />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <title>PAES Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Tipografías de interfaz. `media="print"` evita que retrasen el primer pintado; cada archivo baja solo si se usa. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist:wght@100..900&family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@100..800&family=Space+Grotesk:wght@300..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <script>
      // Evita el destello de tema incorrecto antes de que React monte. `light` y `dark` son valores guardados antes de los temas con nombre.
      try {
        var raw = localStorage.getItem('paes-studio-storage');
        var saved = raw ? (JSON.parse(raw).settings || {}).state?.theme : null;
        var theme = saved === 'light' ? 'geist-light' : saved === 'dark' ? 'geist-dark' : saved;
        var lightThemes = ['geist-light', 'paper'];
        var darkThemes = ['github-dark', 'catppuccin-mocha', 'tokyo-night', 'gruvbox-dark', 'nord', 'rose-pine', 'dracula', 'geist-dark'];
        if (lightThemes.indexOf(theme) < 0 && darkThemes.indexOf(theme) < 0) {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'geist-dark' : 'geist-light';
        }
        document.documentElement.dataset.theme = theme;
        if (darkThemes.indexOf(theme) >= 0) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
