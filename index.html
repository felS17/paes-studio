<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entrena gratis para la PAES con las pruebas reales del DEMRE, explicaciones paso a paso y tarjetas de repaso. Sin cuentas ni contraseñas." />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <title>PAES Studio</title>
    <script>
      // Evita el destello de tema incorrecto antes de que React monte. `light` y `dark` son valores guardados antes de los 4 temas.
      try {
        var raw = localStorage.getItem('paes-studio-storage');
        var saved = raw ? (JSON.parse(raw).settings || {}).state?.theme : null;
        var theme = saved === 'light' ? 'geist-light' : saved === 'dark' ? 'geist-dark' : saved;
        if (['geist-light', 'geist-dark', 'github-dark', 'paper'].indexOf(theme) < 0) {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'geist-dark' : 'geist-light';
        }
        document.documentElement.dataset.theme = theme;
        if (theme === 'geist-dark' || theme === 'github-dark') document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
