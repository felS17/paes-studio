<!doctype html>
<html lang="es-CL">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ensayos PAES oficiales del DEMRE con clavijero, modo práctica con explicaciones, cronómetro oficial y analítica local." />
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    <title>PAES Studio</title>
    <script>
      // Evita el destello de tema incorrecto antes de que React monte.
      try {
        var raw = localStorage.getItem('paes-studio-storage');
        var theme = raw ? (JSON.parse(raw).settings || {}).state?.theme : null;
        var dark = theme === 'dark' || ((!theme || theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
